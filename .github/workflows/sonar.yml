name: SonarCloud

# Runs the SonarCloud scanner on every push and PR. The scanner needs:
#   - The source tree (full clone, hence fetch-depth: 0)
#   - A coverage report in lcov format (vitest emits one with --coverage)
#   - The SONAR_TOKEN secret (created in SonarCloud, added to GitHub repo
#     secrets)
#
# Until SONAR_TOKEN is wired up, the job no-ops on the secret check rather
# than failing CI — useful while the SonarCloud project is being set up.

on:
  push:
    branches: [main, 'week-*']
  pull_request:
    branches: [main]

jobs:
  sonar:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    steps:
      - name: Skip if SONAR_TOKEN missing
        if: ${{ secrets.SONAR_TOKEN == '' }}
        run: |
          echo "SONAR_TOKEN is not set in repo secrets — skipping scan."
          echo "Add it under Settings → Secrets and variables → Actions → New repository secret."
          exit 0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
