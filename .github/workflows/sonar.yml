name: SonarCloud

# Runs the SonarCloud scanner on every push and PR. Requires SONAR_TOKEN
# in repo secrets. The scanner needs:
#   - The source tree (full clone, hence fetch-depth: 0)
#   - A coverage report in lcov format (vitest emits one with --coverage)
#
# In SonarCloud, this project must be set to "CI-based analysis"
# (Administration → Analysis Method) for the scan from this workflow to
# show up. Automatic analysis would otherwise overwrite it.

on:
  push:
    branches: [main, 'week-*']
  pull_request:
    branches: [main]

jobs:
  sonar:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full git history to compute "new code" deltas.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
