# Local SonarQube — Community Edition + Postgres backend.
#
# Replaces the SonarCloud GitHub Action. The cloud free tier doesn't let
# you customise the quality gate or pin the project to a specific Sonar
# version, which gets in the way once a project has its own preferences.
# A self-hosted Community Edition instance has none of those limits.
#
# Lifecycle (from the repo root):
#
#   npm run sonar:up       # start SonarQube on http://localhost:9000
#   # ... wait ~60 seconds for first-run init ...
#   npm run sonar:scan     # run vitest --coverage + push results to Sonar
#   npm run sonar:down     # stop the containers
#
# First-run setup, done once in the browser:
#   1. Open http://localhost:9000
#   2. Log in with admin / admin and change the password
#   3. Create a project manually, projectKey = `joule`
#   4. Account → Security → Generate a token, save it
#   5. Export it locally so the scan picks it up:
#        Windows (PowerShell): $env:SONAR_TOKEN = "<the-token>"
#        macOS/Linux:          export SONAR_TOKEN=<the-token>
#
# Data persists in a named docker volume (sonar_data), so containers
# can be torn down and re-created without losing your project history.

services:
  sonarqube:
    image: sonarqube:community
    container_name: joule-sonarqube
    depends_on:
      - sonar-db
    ports:
      - '9000:9000'
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    # SonarQube is JVM-based and needs sysctl tweaks on Linux to start
    # reliably under load. On Docker Desktop (Mac/Windows) these are
    # ignored. If you hit "max virtual memory areas vm.max_map_count"
    # on Linux, run:  sudo sysctl -w vm.max_map_count=262144
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonar-db:
    image: postgres:15-alpine
    container_name: joule-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_db_data:
