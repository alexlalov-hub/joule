# SonarQube project config for Joule.
#
# Runs against a self-hosted SonarQube Community Edition started by
# docker-compose.sonarqube.yml — see docs/sonar.md for setup. The
# previous SonarCloud config lived here; it was replaced because the
# cloud free tier didn't allow customising quality gates or scanning
# non-main branches without paying.
#
# The scanner reads this file from the repo root. Override the host
# or token at scan time via env (SONAR_HOST_URL, SONAR_TOKEN) or the
# `npm run sonar:scan` wrapper.

sonar.projectKey=joule
sonar.projectName=Joule
sonar.projectVersion=1.0

# Local server. Override with SONAR_HOST_URL for a different host
# (e.g. a shared instance on the network).
sonar.host.url=http://localhost:9000

# Source + test layout
sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,tests/**
sonar.exclusions=**/*.d.ts,**/node_modules/**,**/dist/**,**/.svelte-kit/**,**/build/**,docs/**,supabase/migrations/**,scripts/build-docs.js,.specify/**,.claude/**

# Coverage report from vitest (lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Reporting
sonar.sourceEncoding=UTF-8
