# SonarCloud project config for Joule.
#
# To activate:
#   1. Sign in at sonarcloud.io with your GitHub account
#   2. Import the alexlalov-hub/joule repo into a SonarCloud organisation
#   3. Replace the placeholder `<org-key>` below with the organisation slug
#      shown in SonarCloud (under "Information" on the project page)
#   4. Add the SonarCloud token as the SONAR_TOKEN repo secret on GitHub
#
# The GitHub Action in .github/workflows/sonar.yml takes care of running
# vitest with coverage and feeding the lcov report + the source tree to
# the scanner.

sonar.projectKey=alexlalov-hub_joule
sonar.organization=alexlalov-hub
sonar.projectName=Joule
sonar.projectVersion=1.0

# Source + test layout
sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,tests/**
sonar.exclusions=**/*.d.ts,**/node_modules/**,**/dist/**,**/.svelte-kit/**,**/build/**,docs/**,supabase/migrations/**,scripts/build-docs.js

# Coverage report from vitest (lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Reporting
sonar.sourceEncoding=UTF-8
